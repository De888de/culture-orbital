<script>

document.getElementById('startGame').onclick = function(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const v = document.getElementById('introVideo');
  if(v) v.pause();
};

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const SECTIONS = [
  { id:'hub', name:'Центральный хаб', base:1, cost:15, mult:1.15, unlock:0 },
  { id:'mind', name:'Майнд', base:8, cost:120, mult:1.18, unlock:0 },
  { id:'ship', name:'Корабль Культуры', base:40, cost:900, mult:1.2, unlock:0 },
  { id:'contact', name:'Контакт', base:180, cost:6000, mult:1.22, unlock:0 },
  { id:'sc', name:'Special Circumstances', base:900, cost:45000, mult:1.25, unlock:0 },
  { id:'plate', name:'Плита орбитали', base:2500, cost:200000, mult:1.28, unlock:3600 },
  { id:'gsv', name:'GSV (Общий Системный Аппарат)', base:12000, cost:1500000, mult:1.3, unlock:3600 },
  { id:'sublimed', name:'Вознесённые', base:60000, cost:10000000, mult:1.35, unlock:7200 }
];

const QUOTES = [
  { id:'q1', req:100, text:'«Деньги — признак бедности.» — Иэн М. Бэнкс' },
  { id:'q2', req:1000, text:'«Культура не завоёвывает. Она убеждает.»' },
  { id:'q3', req:10000, text:'«Орбиталь — это не место. Это состояние.»' },
  { id:'q4', req:100000, text:'«Майнд думает быстрее, чем ты успеваешь моргнуть.»' },
  { id:'q5', req:1000000, text:'«Special Circumstances делают то, чего не делают другие.»' }
];

let S = { energy:0, sections:{}, ach:{}, total:0, playTime:0, dailyQuotes:0, quoteDay:0 };
try { S = JSON.parse(localStorage.getItem('orbital') || 'null') || S; } catch(e){}

function save(){ localStorage.setItem('orbital', JSON.stringify(S)); }
function fmt(n){ return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.floor(n); }

function income(){
  return SECTIONS.reduce((s,sec)=> s + (S.sections[sec.id]||0)*sec.base, 0);
}

function render(){
  document.getElementById('energy').textContent = fmt(S.energy);
  document.getElementById('perSec').textContent = '+' + fmt(income()) + ' / сек';

  const box = document.getElementById('sections');
  box.innerHTML = '';
  SECTIONS.forEach(sec=>{
    const unlocked = (S.playTime||0) >= (sec.unlock||0);
    const cnt = S.sections[sec.id]||0;
    const cost = Math.floor(sec.cost * Math.pow(sec.mult, cnt));
    const can = unlocked && S.energy >= cost;
    const el = document.createElement('div');
    el.style.margin = '8px 0';
    if(!unlocked){
      const left = Math.ceil(((sec.unlock||0) - (S.playTime||0))/60);
      el.innerHTML = `<div style="opacity:.5">${sec.name} <span style="color:#8b97b5">(откроется через ${left} мин)</span></div>`;
    } else {
      el.innerHTML = `<div>${sec.name} <b>x${cnt}</b> (+${sec.base}/сек)</div>
        <button ${can?'':'disabled'} data-id="${sec.id}">Купить (${fmt(cost)})</button>`;
    }
    box.appendChild(el);
  });

  const ach = document.getElementById('ach');
  ach.innerHTML = '';
  QUOTES.forEach(q=>{
    const done = S.ach[q.id];
    const el = document.createElement('div');
    el.className = 'quote';
    el.style.opacity = done ? 1 : 0.4;
    el.textContent = done ? q.text : `??? (нужно ${fmt(q.req)} энергии)`;
    ach.appendChild(el);
  });
}

document.getElementById('tap').onclick = ()=>{
  S.energy += 1 + income()*0.1;
  S.total += 1;
  checkAch();
  render(); save();
};

document.getElementById('sections').onclick = e=>{
  const id = e.target.dataset.id;
  if(!id) return;
  const sec = SECTIONS.find(s=>s.id===id);
  const cnt = S.sections[id]||0;
  const cost = Math.floor(sec.cost * Math.pow(sec.mult, cnt));
  if(S.energy >= cost){
    S.energy -= cost;
    S.sections[id] = cnt+1;
    checkAch();
    render(); save();
  }
};

function checkAch(){
  QUOTES.forEach(q=>{
    if(!S.ach[q.id] && S.total >= q.req){
      S.ach[q.id] = true;
      alert(q.text);
    }
  });
}

setInterval(()=>{ S.playTime = (S.playTime||0) + 1; S.playTime = (S.playTime||0) + 1;
  const inc = income();
  if(inc>0){ S.energy += inc; S.total += inc; checkAch(); render(); save(); }
}, 1000);

render();

const LIBRARY = window.LIBRARY || [
  { id:"l1", req:50, text:"Деньги — признак бедности.", work:"Игрок", year:1988 }
];

const ACHIEVEMENTS = window.ACHIEVEMENTS || [
  { id:"a1", req:10, name:"Первый контакт", desc:"Собрать 10 энергии" }
];

let shownLibrary = new Set();


function canShowQuote(){
  const today = new Date().toDateString();
  if(S.quoteDay !== today){ S.quoteDay = today; S.dailyQuotes = 0; }
  return S.dailyQuotes < 4;
}
function markQuoteShown(){
  S.dailyQuotes = (S.dailyQuotes||0) + 1;
  save();
}

function showBubble(text, src){
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="q">«'+text+'»</div><div class="src">'+src+'</div>';
  document.body.appendChild(b);
  setTimeout(()=> b.remove(), 5200);
}

function checkLibrary(){
  LIBRARY.forEach(item=>{
    if(!shownLibrary.has(item.id) && S.total >= item.req){
      shownLibrary.add(item.id);
      if(window.sndAch) window.sndAch(); showBubble(item.text, item.work + ', ' + item.year);
    }
  });
}

function renderLibrary(){
  const box = document.getElementById('screen-library');
  if(!box) return;
  box.innerHTML = '<h2 style="color:#f5c451;text-align:center">Библиотека знаний Иэна Бэнкса</h2>';
  LIBRARY.forEach(item=>{
    const unlocked = S.total >= item.req;
    const el = document.createElement('div');
    el.className = 'card';
    el.style.opacity = unlocked ? 1 : 0.45;
    el.style.cursor = unlocked ? 'pointer' : 'default';
    if(unlocked){
      el.innerHTML = '<div class="quote" style="font-size:14px">«'+item.text+'»</div><div style="font-size:11px;color:#8b97b5;margin-top:6px">'+item.work+', '+item.year+'</div>';
      el.onclick = ()=>{ if(!canShowQuote()){ alert('Сегодня лимит бесплатных цитат исчерпан (4 в день). Остальные — за донат.'); return; } markQuoteShown();
        document.querySelectorAll('#screen-library .card').forEach(c=>c.style.transform='');
        el.style.transform = 'scale(1.03)';
        if(window.sndAch) window.sndAch(); showBubble(item.text, item.work + ', ' + item.year);
      };
    } else {
      el.innerHTML = '<div style="color:#8b97b5">??? (откроется при '+fmt(item.req)+' энергии)</div>';
    }
    box.appendChild(el);
  });
}

function renderAch(){
  const box = document.getElementById('screen-ach');
  if(!box) return;
  box.innerHTML = '<h2 style="color:#f5c451;text-align:center">Достижения</h2><p style="color:#8b97b5;font-size:13px;text-align:center;margin-bottom:12px">Цель: поддерживать цивилизацию Культуры и осваивать новые звёздные системы.</p>';
  ACHIEVEMENTS.forEach(a=>{
    const done = S.total >= a.req;
    const el = document.createElement('div');
    el.className = 'card';
    el.style.opacity = done ? 1 : 0.55;
    el.innerHTML = '<b>'+(done?'✓ ':'○ ')+a.name+'</b><div style="font-size:12px;color:#8b97b5;margin-top:4px">'+a.desc+'</div>';
    box.appendChild(el);
  });
}

// Вкладки


// Подключаем проверку библиотеки
const oldCheck = checkAch;
checkAch = function(){ oldCheck(); checkLibrary(); };

</script>

<script>
(function(){
  function bind(){
    var buttons = document.querySelectorAll('.tabs button');
    buttons.forEach(function(btn){

        buttons.forEach(function(b){ b.classList.remove('on'); });

        btn.classList.add('on');
        var tab = btn.getAttribute('data-tab');
        var scr = document.getElementById('screen-' + tab);
        if(scr) scr.classList.add('on');

        if(tab === 'library'){
          var box = document.getElementById('screen-library');
          if(box){
            box.innerHTML = '<h2 style="color:#f5c451;text-align:center">Библиотека знаний Иэна Бэнкса</h2>';
            (window.LIBRARY || []).forEach(function(item, idx){
              var need = (idx + 1) * 800;
              if((window.S && window.S.total || 0) < need && (typeof S === 'undefined' || (S.total||0) < need)) return;
              var total = (typeof S !== 'undefined' ? S.total : 0) || 0;
              if(total < need) return;
              var el = document.createElement('div');

              box.appendChild(el);
            });
            if(!box.querySelector('.card')) box.innerHTML += '<p style="color:#8b97b5;text-align:center">Цитаты откроются по мере развития орбитали.</p>';
          }
        }
        if(tab === 'ach'){
          var box = document.getElementById('screen-ach');
          if(box){
            box.innerHTML = '<h2 style="color:#f5c451;text-align:center">Достижения</h2><p style="color:#8b97b5;font-size:13px;text-align:center">Цель: поддерживать цивилизацию Культуры и осваивать новые звёздные системы.</p>';
            (window.ACHIEVEMENTS || []).forEach(function(a){

<script>
(function(){
  let ctx, nodes = [];
  function startAmbient(){
    if(ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.value = 0.08;
    master.connect(ctx.destination);

    // Низкий гул
    const osc1 = ctx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 55;
    const g1 = ctx.createGain(); g1.gain.value = 0.4;
    osc1.connect(g1); g1.connect(master); osc1.start();

    // Медленные биения
    const osc2 = ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.value = 110;
    const g2 = ctx.createGain(); g2.gain.value = 0.15;
    osc2.connect(g2); g2.connect(master); osc2.start();

    // Шум
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for(let i=0; i<bufferSize; i++) output[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 400;
    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.06;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master);
    noise.start();

    nodes = [osc1, osc2, noise];
  }
  document.addEventListener('click', startAmbient, { once: true });
  document.addEventListener('touchstart', startAmbient, { once: true });
})();
</script>
<script>
setInterval(function(){
  if(Math.random() < 0.15 && typeof S !== 'undefined'){
    const events = [
      { msg: '⚠ Аномалия в секторе. Энергия нестабильна.', mult: 0.7 },
      { msg: '✦ Майнд оптимизировал поток. +30% энергии.', mult: 1.3 },
      { msg: '◈ Контакт с другой системой. Бонус.', mult: 1.5 }
    ];
    const ev = events[Math.floor(Math.random()*events.length)];
    const bonus = Math.floor((S.energy||0) * 0.05 * ev.mult);
    S.energy = (S.energy||0) + bonus;
    if(typeof save === 'function') save();
    if(typeof render === 'function') render();
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a2338;color:#f5c451;padding:10px 16px;border-radius:10px;z-index:150;font-size:13px;border:1px solid #f5c451';
    t.textContent = ev.msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 3500);
  }
}, 25000);
</script>
<script>
(function(){
  let actx;
  function getCtx(){
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    return actx;
  }
  function beep(freq, dur, type, vol){
    try{
      const c = getCtx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.08, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    }catch(e){}
  }
  window.sndClick = () => beep(880, 0.06, 'square', 0.06);
  window.sndBuy = () => { beep(440, 0.08, 'square', 0.07); setTimeout(()=>beep(660, 0.1, 'square', 0.06), 60); };
  window.sndAch = () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f, 0.12, 'square', 0.08), i*80)); };

  document.addEventListener('click', function(e){
    const t = e.target;
    if(t.tagName === 'BUTTON' || t.closest('button')){
      if(t.id === 'tap' || t.classList.contains('main')) window.sndClick();
      else if(t.dataset && t.dataset.id) window.sndBuy();
      else window.sndClick();
    }
  }, true);
})();
</script>
